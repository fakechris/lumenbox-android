name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public content, secrets, and untracked research rules
        run: python3 scripts/check-public-repo.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Kotlin core unit tests
        run: ./gradlew :core:test
